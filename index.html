<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petrol Maintenance Tracker</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #6b7280;
      --accent: #d9480f; --border: #d9dce1; --warn: #b45309; --warn-bg: #fff4e0;
      --ok: #166534; --ok-bg: #e7f7ec; --err: #b91c1c; --err-bg: #fdecec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6;
        --accent: #ff8a4c; --border: #2f343c; --warn: #fbbf24; --warn-bg: #3a2e12;
        --ok: #86efac; --ok-bg: #12301d; --err: #fca5a5; --err-bg: #3b1616;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; text-align: center; margin: 8px 0 16px; }
    h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 14px;
    }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 12px; color: var(--muted); }
    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 4px; }
    input[type=number], input[type=date] {
      width: 100%; padding: 11px; font-size: 16px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    input[type=file] { width: 100%; font-size: 15px; }
    button {
      width: 100%; padding: 13px; margin-top: 16px; font-size: 16px; font-weight: 600;
      border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    img#preview { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; margin-top: 10px; background: #000; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .box { border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: 14px; white-space: pre-line; }
    .warn { background: var(--warn-bg); color: var(--warn); }
    .ok { background: var(--ok-bg); color: var(--ok); }
    .err { background: var(--err-bg); color: var(--err); }
    .calc { margin-top: 14px; font-size: 15px; line-height: 1.6; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>⛽ Petrol Maintenance Tracker</h1>

  <section class="card" id="statsCard">
    <div class="stats">
      <div class="stat"><b id="sAvg">–</b><span>avg km/L</span></div>
      <div class="stat"><b id="sMonth">–</b><span>spent this month</span></div>
      <div class="stat"><b id="sFills">–</b><span>fill-ups logged</span></div>
    </div>
  </section>

  <form class="card" id="form" autocomplete="off">
    <h2>New fill-up</h2>

    <label for="photo">Odometer photo</label>
    <input type="file" id="photo" accept="image/*" capture="environment">
    <img id="preview" alt="Odometer photo preview" hidden>
    <div class="box" id="ocrMsg" hidden></div>

    <label for="odo">Odometer (km)</label>
    <input type="number" id="odo" inputmode="numeric" placeholder="auto-filled from photo" required>

    <label for="date">Date</label>
    <input type="date" id="date" required>

    <label for="amount">Amount paid (₹)</label>
    <input type="number" id="amount" inputmode="decimal" step="0.01" placeholder="e.g. 470" required>

    <label for="price">Petrol price (₹/L)</label>
    <input type="number" id="price" inputmode="decimal" step="0.01" placeholder="looking up…" required>
    <div class="hint" id="priceHint"></div>

    <div class="calc" id="calc"></div>
    <div id="warnings"></div>

    <button type="submit" id="save">Save entry</button>
    <div class="box" id="result" hidden></div>
  </form>

  <section class="card">
    <h2>Recent fill-ups</h2>
    <table>
      <thead><tr><th>Date</th><th>Odo</th><th>₹</th><th>L</th><th>km/L</th></tr></thead>
      <tbody id="recent"><tr><td colspan="5">Loading…</td></tr></tbody>
    </table>
  </section>
</main>

<script>
  // Your deployed Apps Script web app URL (/exec). Redeploy as a NEW VERSION to keep the same URL.
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzsok2FgiLeWw83NwHZDRZy-H8vVY1WHkcFR9uyk_-k5JLWVKMIblzR9w2SmVTMbxM05Q/exec';

  const FALLBACK_MILEAGE = 40; // used for the range estimate until real mileage data exists
  const state = { image: null, lastOdometer: null, avgMileage: null, limits: { tankMax: 5.3, usualMin: 3.5, maxGapKm: 600 } };
  const $ = (id) => document.getElementById(id);

  // <resolve-digits>
  // The OCR may return "?" for a scratched digit. If exactly one value fits between the
  // last logged odometer and last + maxGap, use it; otherwise leave it for manual entry.
  function resolveDigits(digits, lastOdo, maxGap) {
    if (!digits) return null;
    const s = String(digits).replace(/[^0-9?]/g, '');
    if (!s) return null;
    if (s.indexOf('?') === -1) return { value: parseInt(s, 10), guessed: false };
    if (lastOdo == null) return null;
    const q = (s.match(/\?/g) || []).length;
    if (q > 2) return null;
    const hits = [];
    const total = Math.pow(10, q);
    for (let n = 0; n < total; n++) {
      const fill = String(n).padStart(q, '0');
      let i = 0;
      const cand = parseInt(s.replace(/\?/g, () => fill[i++]), 10);
      if (cand >= lastOdo && cand <= lastOdo + maxGap) hits.push(cand);
    }
    return hits.length === 1 ? { value: hits[0], guessed: true } : null;
  }
  // </resolve-digits>

  function getPin() {
    let p = '';
    try { p = localStorage.getItem('tracker_pin') || ''; } catch (e) {}
    if (!p) {
      p = (prompt('Enter your tracker PIN (the APP_PIN you set in the script):') || '').trim();
      try { if (p) localStorage.setItem('tracker_pin', p); } catch (e) {}
    }
    return p;
  }

  async function api(payload) {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight
      body: JSON.stringify(Object.assign({ pin: getPin() }, payload)),
    });
    const data = await res.json();
    if (!data.ok && /Wrong PIN/i.test(data.error || '')) {
      try { localStorage.removeItem('tracker_pin'); } catch (e) {}
    }
    return data;
  }

  // Shrink phone photos (several MB) to ~1280px JPEG before upload.
  function compress(file, maxSide = 1280, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
      img.src = url;
    });
  }

  function show(el, cls, text) {
    el.className = 'box ' + cls;
    el.textContent = text;
    el.hidden = !text;
  }

  function todayISO() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function renderSummary(s) {
    state.lastOdometer = s.lastOdometer;
    state.avgMileage = s.avgMileage;
    state.limits = s.limits || state.limits;
    $('sAvg').textContent = s.avgMileage != null ? s.avgMileage : '–';
    $('sMonth').textContent = '₹' + Math.round(s.monthSpend || 0);
    $('sFills').textContent = s.fills;

    const tb = $('recent');
    tb.textContent = '';
    if (!s.recent.length) {
      const tr = tb.insertRow(); const td = tr.insertCell(); td.colSpan = 5; td.textContent = 'No entries yet.';
    }
    s.recent.forEach((r) => {
      const tr = tb.insertRow();
      [r.date, r.odometer, r.amount, r.litres, r.mileage == null ? '–' : r.mileage]
        .forEach((v) => { tr.insertCell().textContent = v; });
    });

    if (s.price && s.price.price) {
      $('price').value = s.price.price;
      $('priceHint').textContent = s.price.source +
        '. Pumps in a city differ by only a few paise; edit this if your pump slip shows a different rate.';
    } else {
      $('priceHint').textContent = 'Price lookup unavailable: enter the rate from your pump slip.';
    }
    recalc();
  }

  async function loadSummary() {
    try {
      const s = await api({ action: 'summary' });
      if (!s.ok) throw new Error(s.error);
      renderSummary(s);
    } catch (e) {
      show($('result'), 'err', 'Could not load data: ' + e.message);
    }
  }

  function recalc() {
    const odo = +$('odo').value, amt = +$('amount').value, pr = +$('price').value;
    const lines = [], warns = [];
    const L = state.limits;
    const litres = amt > 0 && pr > 0 ? amt / pr : null;
    const km = state.lastOdometer != null && odo > 0 ? odo - state.lastOdometer : null;

    if (litres) lines.push('Fuel filled: ' + litres.toFixed(2) + ' L');
    if (km != null && km > 0) {
      lines.push('Distance since last fill: ' + km + ' km');
      if (litres) {
        lines.push('Mileage: ' + (km / litres).toFixed(1) + ' km/L  ·  ₹' + (amt / km).toFixed(2) + ' per km');
      }
    }
    if (litres) {
      const m = state.avgMileage || FALLBACK_MILEAGE;
      const range = Math.round(litres * m);
      lines.push('This tank should last about ' + range + ' km' +
        (odo > 0 ? ' (till odometer ≈ ' + (odo + range) + ')' : '') +
        (state.avgMileage ? '' : ' (assuming ' + FALLBACK_MILEAGE + ' km/L until you have data)'));
    }

    if (km != null && odo > 0 && km <= 0) warns.push('Odometer is not higher than your last entry (' + state.lastOdometer + '). Check the first digit.');
    if (km != null && km > L.maxGapKm) warns.push(km + ' km since last fill: is a fill-up missing or the odometer misread?');
    if (litres && (litres < L.usualMin || litres > L.tankMax)) {
      warns.push('Litres (' + litres.toFixed(2) + ') is outside ' + L.usualMin + '–' + L.tankMax + ' L. Was the tank filled to full, and is the price/amount right?');
    }

    $('calc').textContent = lines.join('\n');
    $('calc').style.whiteSpace = 'pre-line';
    show($('warnings'), 'warn', warns.join('\n'));
  }

  $('photo').addEventListener('change', async () => {
    const file = $('photo').files[0];
    if (!file) return;
    show($('ocrMsg'), 'ok', 'Reading odometer from photo…');
    try {
      state.image = await compress(file);
      $('preview').src = 'data:image/jpeg;base64,' + state.image;
      $('preview').hidden = false;

      const r = await api({ action: 'ocr', image: state.image, mime: 'image/jpeg' });
      if (!r.ok) throw new Error(r.error);

      const res = resolveDigits(r.digits, state.lastOdometer, state.limits.maxGapKm);
      if (res) {
        $('odo').value = res.value;
        const extra = res.guessed ? ' Unclear digit filled in from your last entry.' : '';
        show($('ocrMsg'), r.confidence === 'high' && !res.guessed ? 'ok' : 'warn',
          'Read ' + res.value + ' km (' + r.confidence + ' confidence).' + extra +
          (r.note ? ' Note: ' + r.note + '.' : '') + ' Please check it against the photo.');
      } else {
        show($('ocrMsg'), 'warn', 'Could not read the odometer reliably' +
          (r.digits ? ' (saw "' + r.digits + '")' : '') + '. Please type it in.');
      }
    } catch (e) {
      show($('ocrMsg'), 'err', 'Photo read failed: ' + e.message + ' You can still type the odometer in.');
    }
    recalc();
  });

  ['odo', 'amount', 'price'].forEach((id) => $(id).addEventListener('input', recalc));

  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('save').disabled = true;
    show($('result'), 'ok', 'Saving…');
    try {
      const priceHint = $('priceHint').textContent.split('. Pumps')[0];
      const r = await api({
        action: 'log',
        odometer: +$('odo').value,
        amount: +$('amount').value,
        price: +$('price').value,
        date: $('date').value,
        priceSource: priceHint,
        image: state.image,
        mime: 'image/jpeg',
      });
      if (!r.ok) throw new Error(r.error);

      let msg = 'Saved. ' + r.litres + ' L';
      if (r.mileage != null) msg += ' · ' + r.mileage + ' km/L · ₹' + r.costPerKm + '/km over ' + r.km + ' km';
      else msg += '. Mileage will show from your next fill-up.';
      show($('result'), r.warnings && r.warnings.length ? 'warn' : 'ok',
        msg + (r.warnings && r.warnings.length ? '\n' + r.warnings.join('\n') : ''));

      $('form').reset();
      $('date').value = todayISO();
      $('preview').hidden = true;
      show($('ocrMsg'), 'ok', '');
      state.image = null;
      loadSummary();
    } catch (e) {
      show($('result'), 'err', 'Not saved: ' + e.message);
    } finally {
      $('save').disabled = false;
    }
  });

  $('date').value = todayISO();
  loadSummary();
</script>
</body>
</html>
